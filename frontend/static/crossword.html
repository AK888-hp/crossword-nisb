<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>CROSSCURRENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --grid-bg: #000000;
            --cell-bg: #111111;
            --cell-text: #FFFFFF;
            --cell-border: #333333;
            --highlight-word: #222222;
            --highlight-cell: #D4FF00;
            --focus-text: #000000;
            --correct-bg: #111111;
            --correct-text: #D4FF00;
            --accent-color: #D4FF00;
            --text-color: #FFFFFF;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(-45deg, #000000, #081100, #142a00, #000000);
            background-size: 400% 400%;
            animation: aurora 15s ease infinite;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        @keyframes aurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .left-pane {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            padding: 20px;
        }

        .right-pane {
            width: 350px;
            background: #0a0a0a;
            border-left: 2px solid #222;
            display: flex;
            flex-direction: column;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.9);
            z-index: 100;
        }
        
        .mobile-fs-btn {
            display: none; /* Hidden on desktop */
        }

        /* ===== MOBILE RESPONSIVE ===== */
        @media (max-width: 768px) {
            body {
                overflow: auto; 
                height: 100vh;
                touch-action: pan-x pan-y pinch-zoom;
            }
            .app-container {
                display: block; 
                height: 100vh;
                overflow: auto;
            }
            .left-pane {
                display: block !important; 
                width: 100%;
                height: 100%;
                overflow: auto;
                -webkit-overflow-scrolling: touch;
                padding: 10px;
                box-sizing: border-box;
            }
            .crossword-wrapper {
                width: max-content !important; 
                height: max-content !important; 
                /* Adds top padding to center the grid, and huge bottom margin so it can scroll above the keyboard */
                margin: 30vh auto 60vh auto !important; 
            }
            .right-pane {
                display: none !important;
            }
            /* Square grids */
            td {
                width: 35px !important;
                height: 35px !important;
                min-width: 35px !important;
                min-height: 35px !important;
                box-sizing: border-box;
            }
            input {
                font-size: 16px !important;
            }
            .number {
                font-size: 8px !important;
            }

            /* Floating Mobile Fullscreen Button - Moved to TOP */
            .mobile-fs-btn {
                display: flex;
                position: fixed;
                top: 10px;
                right: 10px;
                width: 45px;
                height: 45px;
                background: rgba(0,0,0,0.85);
                border: 2px solid var(--accent-color);
                color: var(--accent-color);
                border-radius: 50%;
                justify-content: center;
                align-items: center;
                font-size: 20px;
                z-index: 9000;
                box-shadow: 0 0 15px rgba(212,255,0,0.4);
                cursor: pointer;
            }
        }

        /* ===== MOBILE CLUE POPUP (Movable) ===== */
        .mobile-clue-popup {
            display: none;
        }
        @media (max-width: 768px) {
            .mobile-clue-popup {
                display: none;
                position: fixed;
                top: 10%;
                left: 5%;
                width: 90%;
                z-index: 8888;
                background: rgba(8, 8, 8, 0.95);
                border: 1px solid var(--accent-color);
                border-radius: 8px;
                padding: 8px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.8);
                box-sizing: border-box;
                max-height: 40vh;
                overflow-y: auto;
                transform: translate3d(0, 0, 0); 
            }
            .mobile-clue-popup.visible {
                display: block;
            }
            .mobile-clue-popup .mcp-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 5px;
                padding-bottom: 5px;
                border-bottom: 1px solid #333;
                cursor: move;
                touch-action: none;
            }
            .mobile-clue-popup .mcp-meta {
                font-family: 'Orbitron', sans-serif;
                font-size: 0.6em;
                letter-spacing: 1px;
                color: var(--accent-color);
                text-transform: uppercase;
            }
            .mobile-clue-popup .mcp-close {
                background: transparent;
                border: none;
                color: #aaa;
                font-size: 1.2em;
                padding: 0 5px;
                cursor: pointer;
            }
            .mobile-clue-popup .mcp-close:active {
                color: var(--accent-color);
            }
            .mobile-clue-popup .mcp-text {
                font-family: 'Rajdhani', sans-serif;
                font-size: 0.9em;
                font-weight: 500;
                color: #fff;
                line-height: 1.2;
                margin-bottom: 5px;
            }
            .mobile-clue-popup .mcp-timer {
                font-family: 'Orbitron', sans-serif;
                font-size: 0.6em;
                color: var(--accent-color);
                letter-spacing: 1px;
                text-align: right;
                margin-top: 0;
            }
        }

        /* ===== FULLSCREEN MODE STYLES ===== */
        :fullscreen, :-webkit-full-screen, :-moz-full-screen {
            background-color: var(--bg-color); /* Ensure full black background */
        }
        :fullscreen body,
        :-webkit-full-screen body,
        :-moz-full-screen body {
            overflow: auto !important;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            touch-action: pan-x pan-y pinch-zoom;
        }
        :fullscreen .app-container,
        :-webkit-full-screen .app-container,
        :-moz-full-screen .app-container {
            display: block !important; 
            width: 100vw;
            height: 100vh;
            overflow: auto !important;
            margin: 0;
            padding: 0;
        }
        :fullscreen .left-pane,
        :-webkit-full-screen .left-pane,
        :-moz-full-screen .left-pane {
            display: block !important; 
            width: 100%;
            height: 100%;
            overflow: auto !important;
            -webkit-overflow-scrolling: touch;
            padding: 0 !important; 
            box-sizing: border-box;
        }
        :fullscreen .crossword-wrapper,
        :-webkit-full-screen .crossword-wrapper,
        :-moz-full-screen .crossword-wrapper {
            width: max-content !important;
            height: max-content !important;
            margin: 0 auto !important; 
            border: none !important;
            padding: 5px !important;
        }
        :fullscreen .right-pane,
        :-webkit-full-screen .right-pane,
        :-moz-full-screen .right-pane {
            display: none !important;
        }
        :fullscreen .fullscreen-btn,
        :-webkit-full-screen .fullscreen-btn,
        :-moz-full-screen .fullscreen-btn {
            display: none !important;
        }

        /* Maintain Mobile Padding Overrides Even in Fullscreen */
        @media (max-width: 768px) {
            :fullscreen .crossword-wrapper,
            :-webkit-full-screen .crossword-wrapper,
            :-moz-full-screen .crossword-wrapper {
                margin: 30vh auto 60vh auto !important; 
            }
            :fullscreen .left-pane,
            :-webkit-full-screen .left-pane,
            :-moz-full-screen .left-pane {
                padding: 10px !important;
            }
        }

        .dashboard-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888888;
            margin-bottom: 2px;
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8em;
            font-weight: 900;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(212, 255, 0, 0.3);
        }

        .fullscreen-btn {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            font-family: 'Orbitron', sans-serif;
            padding: 10px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 2px;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 30px;
        }

        .fullscreen-btn:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 15px var(--accent-color);
        }

        /* Fullscreen mode: hide right panel */
        .right-pane.fs-hidden {
            display: none !important;
        }

        .clue-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-top: 1px solid #333;
            padding-top: 30px;
        }

        .clue-meta {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-color);
            display: block;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .clue-text-container {
            font-size: 1.4em;
            font-weight: 600;
            line-height: 1.5;
            color: #ffffff;
        }

        .clue-placeholder {
            color: #555;
            font-style: italic;
            text-align: center;
            margin-top: 50px;
            font-size: 1.2em;
        }

        .crossword-wrapper {
            background: var(--grid-bg);
            padding: 15px;
            border: 2px solid var(--cell-border);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            transform-origin: center center;
        }

        table {
            border-collapse: collapse;
            background-color: var(--grid-bg);
            animation: fadeInGrid 1s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        @keyframes fadeInGrid {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        td {
            width: 45px; 
            height: 45px;
            padding: 0;
            margin: 0;
            border: 1px solid var(--cell-border);
            position: relative;
            transition: background-color 0.2s ease;
        }

        td.cell-empty {
            background-color: transparent;
            border-color: transparent;
        }

        td.cell-active {
            background-color: var(--cell-bg);
            border: 2px solid #555555;
        }

        td.cell-highlighted {
            background-color: var(--highlight-word);
        }

        td.cell-correct {
            background-color: var(--correct-bg) !important;
            border-top-color: var(--correct-border-top, var(--correct-border, var(--accent-color))) !important;
            border-left-color: var(--correct-border-left, var(--correct-border, var(--accent-color))) !important;
            border-bottom-color: var(--correct-border-bottom, var(--correct-border, var(--accent-color))) !important;
            border-right-color: var(--correct-border-right, var(--correct-border, var(--accent-color))) !important;
            animation: correctPulse 0.6s cubic-bezier(0.1, 0.8, 0.2, 1);
            z-index: 5;
        }

        @keyframes correctPulse {
            0% { transform: scale(1); background-color: #ffffff; }
            50% { transform: scale(1.15); background-color: var(--accent-color); box-shadow: 0 0 30px var(--accent-color); z-index: 50; }
            100% { transform: scale(1); }
        }

        input {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            text-align: center;
            font-size: 24px; 
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            text-transform: uppercase;
            border: none;
            background: transparent;
            outline: none;
            color: var(--cell-text);
            cursor: pointer;
            caret-color: transparent;
            transition: all 0.2s ease;
        }

        input:focus {
            background-color: var(--highlight-cell);
            color: var(--focus-text);
            transform: scale(1.15);
            box-shadow: 0 0 20px var(--accent-color);
            z-index: 10;
        }

        td.cell-correct input {
            color: var(--correct-text, var(--accent-color)) !important;
            text-shadow: var(--correct-shadow, 0 0 10px var(--correct-text, var(--accent-color))) !important;
            font-weight: 700;
        }

        .number {
            position: absolute;
            top: 2px;
            left: 3px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #888888;
            pointer-events: none;
            z-index: 2;
        }
        
        .victory-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 2000;
        }
        
        .victory-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 4em;
            color: var(--accent-color);
            text-shadow: 0 0 30px rgba(212, 255, 0, 0.8);
            margin-bottom: 20px;
            letter-spacing: 5px;
            text-align: center;
            animation: pulse 1s infinite;
        }
        
        .loading {
            font-family: 'Orbitron', sans-serif;
            font-size: 2em;
            font-weight: 900;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 4px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; text-shadow: 0 0 0 rgba(212, 255, 0, 0); transform: scale(1); }
            50% { opacity: 1; text-shadow: 0 0 20px rgba(212, 255, 0, 0.8); transform: scale(1.05); }
            100% { opacity: 0.3; text-shadow: 0 0 0 rgba(212, 255, 0, 0); transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="left-pane">
        <div class="crossword-wrapper" id="grid-container">
            <div class="loading">Loading Grid...</div>
        </div>
    </div>
    
    <div class="right-pane">
        <div class="dashboard-stats">
            <div class="stat-box">
                <span class="stat-label">Time</span>
                <span class="stat-value"><span id="timer">0</span>s</span>
            </div>
        </div>
        
        <button class="fullscreen-btn" id="fs-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
        
        <div class="clue-panel">
            <span class="clue-meta" id="clue-meta-text"></span>
            <div class="clue-text-container" id="clue-text-container">
                <div class="clue-placeholder">Select a box to reveal the clue.</div>
            </div>
        </div>
    </div>
</div>
    
<div class="victory-overlay" id="victory-overlay">
    <div class="victory-text">CROSSWORD SOLVED!</div>
    <div class="stat-value" id="final-stats"></div>
</div>

<div class="mobile-clue-popup" id="mobile-clue-popup">
    <div class="mcp-header" id="mcp-header">
        <span class="mcp-meta" id="mcp-meta"></span>
        <button class="mcp-close" onclick="closeMobileClue()">✖</button>
    </div>
    <div class="mcp-text" id="mcp-text"></div>
    <div class="mcp-timer">⏱ <span id="mcp-timer-val">0</span>s</div>
</div>

<button class="mobile-fs-btn" id="mobile-fs-btn" onclick="toggleMobileFullScreen()">⛶</button>

<script>
    var current_username = '';
    var api_url = '';
    
    let gridData = {};
    let currentWordInfo = null;
    let timeSeconds = 0;
    let timerInterval;
    let wordsCompleted = new Set();
    let cellMap = {}; 

    const cyberPalette = [
        '#D4FF00', // Neon Yellow
        '#00F0FF', // Cyan
        '#FF003C', // Magenta
        '#FF5E00', // Neon Orange
        '#B000FF', // Purple
        '#00FFCC'  // Mint/Teal
    ];

    async function fetchGrid() {
        try {
            const response = await fetch(`${api_url}/grid`);
            const data = await response.json();
            gridData = data;
            document.getElementById('grid-container').innerHTML = ''; 
            renderGrid();
            startTimer();
        } catch (e) {
            console.error("Error fetching grid:", e);
            document.getElementById('grid-container').innerHTML = "<div class='loading' style='color:#ff3333;'>Error loading grid.</div>";
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                alert(`Error attempting to enable fullscreen mode: ${err.message} (${err.name})`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    function toggleMobileFullScreen() {
        const el = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (el.requestFullscreen) {
                el.requestFullscreen();
            } else if (el.webkitRequestFullscreen) {
                el.webkitRequestFullscreen();
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    }

    // Toggle Mobile FS Icon
    document.addEventListener('fullscreenchange', updateFsIcon);
    document.addEventListener('webkitfullscreenchange', updateFsIcon);

    function updateFsIcon() {
        const btn = document.getElementById('mobile-fs-btn');
        if (document.fullscreenElement || document.webkitFullscreenElement) {
            btn.innerHTML = '✖';
        } else {
            btn.innerHTML = '⛶';
        }
    }

    // Drag Logic for Mobile Clue Popup
    const mcp = document.getElementById('mobile-clue-popup');
    const mcpHeader = document.getElementById('mcp-header');

    let isDragging = false;
    let currentX;
    let currentY;
    let initialX;
    let initialY;
    let xOffset = 0;
    let yOffset = 0;

    mcpHeader.addEventListener("touchstart", dragStart, {passive: false});
    document.addEventListener("touchend", dragEnd, {passive: false});
    document.addEventListener("touchmove", drag, {passive: false});

    mcpHeader.addEventListener("mousedown", dragStart);
    document.addEventListener("mouseup", dragEnd);
    document.addEventListener("mousemove", drag);

    function dragStart(e) {
        if (e.type === "touchstart") {
            initialX = e.touches[0].clientX - xOffset;
            initialY = e.touches[0].clientY - yOffset;
        } else {
            initialX = e.clientX - xOffset;
            initialY = e.clientY - yOffset;
        }
        if (e.target === mcpHeader || mcpHeader.contains(e.target)) {
            isDragging = true;
        }
    }

    function dragEnd(e) {
        initialX = currentX;
        initialY = currentY;
        isDragging = false;
    }

    function drag(e) {
        if (isDragging) {
            e.preventDefault();
            if (e.type === "touchmove") {
                currentX = e.touches[0].clientX - initialX;
                currentY = e.touches[0].clientY - initialY;
            } else {
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
            }
            xOffset = currentX;
            yOffset = currentY;
            setTranslate(currentX, currentY, mcp);
        }
    }

    function setTranslate(xPos, yPos, el) {
        el.style.transform = "translate3d(" + xPos + "px, " + yPos + "px, 0)";
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeSeconds++;
            document.getElementById('timer').innerText = timeSeconds;
            const mcpTimer = document.getElementById('mcp-timer-val');
            if (mcpTimer) mcpTimer.innerText = timeSeconds;
        }, 1000);
    }

    function renderGrid() {
        const container = document.getElementById('grid-container');
        const table = document.createElement('table');
        
        const width = gridData.dimensions.width;
        const height = gridData.dimensions.height;
        
        gridData.words.forEach((word, index) => {
            word.index = index;
            const num = index + 1;
            let isStart = true;
            
            for(let i=0; i<word.length; i++) {
                const cx = word.direction === 'across' ? word.x + i : word.x;
                const cy = word.direction === 'down' ? word.y + i : word.y;
                const key = `${cx}-${cy}`;
                
                if(!cellMap[key]) cellMap[key] = { words: [], number: null };
                cellMap[key].words.push(word);
                if(isStart && !cellMap[key].number) {
                    cellMap[key].number = num;
                }
                isStart = false;
            }
        });
        
        // Assign colors ensuring no intersections share a color
        gridData.words.forEach((word) => {
            let usedColors = new Set();
            for(let i=0; i<word.length; i++) {
                const cx = word.direction === 'across' ? word.x + i : word.x;
                const cy = word.direction === 'down' ? word.y + i : word.y;
                const key = `${cx}-${cy}`;
                cellMap[key].words.forEach(w => {
                    if (w.id !== word.id && w.color) {
                        usedColors.add(w.color);
                    }
                });
            }
            
            let preferredStartIndex = word.index % cyberPalette.length;
            let chosenColor = null;
            for(let i=0; i<cyberPalette.length; i++) {
                let colorToTry = cyberPalette[(preferredStartIndex + i) % cyberPalette.length];
                if(!usedColors.has(colorToTry)) {
                    chosenColor = colorToTry;
                    break;
                }
            }
            word.color = chosenColor || cyberPalette[0];
            
            // Manual overrides for confusing adjacencies
            if (word.index + 1 === 8) {
                word.color = '#FF5E00'; // Neon Orange
            }
            if (word.index + 1 === 20) {
                word.color = '#00F0FF'; // Cyan
            }
        });

        for(let y=0; y<height; y++) {
            const tr = document.createElement('tr');
            for(let x=0; x<width; x++) {
                const td = document.createElement('td');
                const key = `${x}-${y}`;
                
                if(cellMap[key]) {
                    td.className = 'cell-active';
                    td.id = `td-${x}-${y}`;
                    
                    const intersectingWords = cellMap[key].words;
                    if (intersectingWords.length > 1) {
                        const acrossW = intersectingWords.find(w => w.direction === 'across');
                        const downW = intersectingWords.find(w => w.direction === 'down');
                        if (acrossW && downW) {
                            td.style.borderTopColor = acrossW.color;
                            td.style.borderBottomColor = acrossW.color;
                            td.style.borderLeftColor = downW.color;
                            td.style.borderRightColor = downW.color;
                        } else {
                            td.style.borderColor = intersectingWords[0].color;
                        }
                    } else {
                        td.style.borderColor = intersectingWords[0].color;
                    }
                    
                    if(cellMap[key].number) {
                        const numDiv = document.createElement('div');
                        numDiv.className = 'number';
                        numDiv.innerText = cellMap[key].number;
                        td.appendChild(numDiv);
                    }
                    
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.id = `input-${x}-${y}`;
                    
                    input.addEventListener('focus', () => handleCellFocus(x, y, cellMap[key].words));
                    input.addEventListener('input', (e) => handleCellInput(e, x, y));
                    input.addEventListener('keydown', (e) => {
                        if (/^[a-zA-Z]$/.test(e.key)) {
                            e.target.value = '';
                        }
                        handleCellKeydown(e, x, y, cellMap[key].words);
                    });
                    
                    td.appendChild(input);
                } else {
                    td.className = 'cell-empty';
                }
                tr.appendChild(td);
            }
            table.appendChild(tr);
        }
        container.appendChild(table);
    }

    function handleCellFocus(x, y, words, explicitWord = null) {
        document.querySelectorAll('td').forEach(td => td.classList.remove('cell-highlighted'));
        
        if(words.length === 0) return;
        
        let selectedWord;
        if (explicitWord) {
            selectedWord = explicitWord;
        } else {
            const uncompletedWords = words.filter(w => !wordsCompleted.has(w.id));
            if (uncompletedWords.length > 0) {
                if (currentWordInfo && uncompletedWords.find(w => w.id === currentWordInfo.id)) {
                    selectedWord = uncompletedWords.find(w => w.id === currentWordInfo.id);
                } else {
                    selectedWord = uncompletedWords[0];
                }
            } else {
                if (currentWordInfo && words.find(w => w.id === currentWordInfo.id)) {
                    selectedWord = words.find(w => w.id === currentWordInfo.id);
                } else {
                    selectedWord = words[0];
                }
            }
        }
        
        currentWordInfo = selectedWord;
        document.documentElement.style.setProperty('--accent-color', selectedWord.color);
        document.documentElement.style.setProperty('--highlight-cell', selectedWord.color);
        
        highlightWord(selectedWord);
        updateSidePanelClue(selectedWord);
    }
    
    function updateSidePanelClue(word) {
        const metaText = `${word.direction} • ${word.length} letters`;
        document.getElementById('clue-meta-text').innerText = metaText;
        
        let contentHtml = `<div>${word.clue}</div>`;
        if (word.image) {
            contentHtml += `<img src="${word.image}" style="max-width:100%; max-height: 250px; margin-top: 20px; border: 1px solid #333; border-radius: 4px;">`;
        }
        document.getElementById('clue-text-container').innerHTML = contentHtml;

        // Update mobile clue popup
        if (window.innerWidth <= 768) {
            document.getElementById('mcp-meta').innerText = metaText;
            document.getElementById('mcp-text').innerText = word.clue;
            document.getElementById('mobile-clue-popup').classList.add('visible');
        }
    }

    function closeMobileClue() {
        document.getElementById('mobile-clue-popup').classList.remove('visible');
    }
    
    function highlightWord(word) {
        for(let i=0; i<word.length; i++) {
            const cx = word.direction === 'across' ? word.x + i : word.x;
            const cy = word.direction === 'down' ? word.y + i : word.y;
            const td = document.getElementById(`td-${cx}-${cy}`);
            if(td && !td.classList.contains('cell-correct')) {
                td.classList.add('cell-highlighted');
            }
        }
    }

    function handleCellInput(e, x, y) {
        let val = e.target.value;
        
        // Safety lock for mobile keyboards: prevent multi-char dumps from swipe/autocomplete
        if (val.length > 1) {
            val = val.substring(val.length - 1); // Extract the very last typed character
            e.target.value = val;
        }

        if(val && currentWordInfo) {
            const wordToValidate = currentWordInfo; 
            
            // Calculate exactly where the word ends
            const endX = currentWordInfo.direction === 'across' ? currentWordInfo.x + currentWordInfo.length - 1 : currentWordInfo.x;
            const endY = currentWordInfo.direction === 'down' ? currentWordInfo.y + currentWordInfo.length - 1 : currentWordInfo.y;
            
            // Check if the current box being typed in is the LAST box of the word
            const isAtEnd = (currentWordInfo.direction === 'across' && x === endX) || 
                            (currentWordInfo.direction === 'down' && y === endY);
            
            if (!isAtEnd) {
                // If not at the end, move the cursor forward
                let nx = x;
                let ny = y;
                if(currentWordInfo.direction === 'across') nx++;
                else ny++;
                
                const nextInput = document.getElementById(`input-${nx}-${ny}`);
                if(nextInput && !nextInput.disabled) {
                    nextInput.focus();
                }
            } 
            // NOTE: If isAtEnd is true, the cursor explicitly does NOT move forward.

            autoValidate(wordToValidate); 
        }
    }

    function handleCellKeydown(e, x, y, words) {
        if(e.key === 'Backspace' && !e.target.value) {
            let nx = x;
            let ny = y;
            if(currentWordInfo && currentWordInfo.direction === 'across') nx--;
            else if(currentWordInfo && currentWordInfo.direction === 'down') ny--;
            
            const prevInput = document.getElementById(`input-${nx}-${ny}`);
            if(prevInput && !prevInput.disabled) {
                prevInput.focus();
            }
        }
        if(e.key === ' ' && words.length > 1) {
            e.preventDefault();
            let nextWord = currentWordInfo.id === words[0].id ? words[1] : words[0];
            handleCellFocus(x, y, words, nextWord); 
        }
    }
    
    async function autoValidate(wordInfo) {
        if(!wordInfo) return;
        if(wordsCompleted.has(wordInfo.id)) return;
        
        let guessedWord = "";
        let isComplete = true; // Strict validation flag
        
        for(let i=0; i<wordInfo.length; i++) {
            const cx = wordInfo.direction === 'across' ? wordInfo.x + i : wordInfo.x;
            const cy = wordInfo.direction === 'down' ? wordInfo.y + i : wordInfo.y;
            const input = document.getElementById(`input-${cx}-${cy}`);
            
            // Ensure EVERY box has exactly 1 valid character before allowing a backend check
            if (input && input.value && input.value.trim().length > 0) {
                guessedWord += input.value.trim().charAt(0);
            } else {
                isComplete = false; 
                break; // Missing letter, abort validation
            }
        }
        
        // Stop execution if there are empty boxes, or if somehow the combined length doesn't perfectly match
        if(!isComplete || guessedWord.length !== wordInfo.length) {
            return; 
        }

        try {
            const response = await fetch(`${api_url}/validate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    x: wordInfo.x,
                    y: wordInfo.y,
                    direction: wordInfo.direction,
                    word: guessedWord
                })
            });
            
            const data = await response.json();
            if(data.correct) {
                wordsCompleted.add(wordInfo.id);
                
                for(let i=0; i<wordInfo.length; i++) {
                    const cx = wordInfo.direction === 'across' ? wordInfo.x + i : wordInfo.x;
                    const cy = wordInfo.direction === 'down' ? wordInfo.y + i : wordInfo.y;
                    const td = document.getElementById(`td-${cx}-${cy}`);
                    const input = document.getElementById(`input-${cx}-${cy}`);
                    td.classList.remove('cell-highlighted');
                    td.classList.add('cell-correct');
                    
                    const intersectingWords = cellMap[`${cx}-${cy}`].words;
                    const completedIntersectingWords = intersectingWords.filter(w => wordsCompleted.has(w.id));
                    
                    if (completedIntersectingWords.length > 1) {
                        const acrossW = completedIntersectingWords.find(w => w.direction === 'across');
                        const downW = completedIntersectingWords.find(w => w.direction === 'down');
                        
                        if (acrossW && downW) {
                            td.style.setProperty('--correct-border-top', acrossW.color);
                            td.style.setProperty('--correct-border-bottom', acrossW.color);
                            td.style.setProperty('--correct-border-left', downW.color);
                            td.style.setProperty('--correct-border-right', downW.color);
                            input.style.setProperty('--correct-text', '#FFFFFF');
                            input.style.setProperty('--correct-shadow', `-3px -3px 10px ${acrossW.color}, 3px 3px 10px ${downW.color}, 0 0 5px #ffffff`);
                        } else {
                            const c1 = completedIntersectingWords[0].color;
                            const c2 = completedIntersectingWords[1].color;
                            
                            td.style.setProperty('--correct-border-top', c1);
                            td.style.setProperty('--correct-border-left', c1);
                            td.style.setProperty('--correct-border-bottom', c2);
                            td.style.setProperty('--correct-border-right', c2);
                            
                            input.style.setProperty('--correct-text', '#FFFFFF');
                            input.style.setProperty('--correct-shadow', `-3px -3px 10px ${c1}, 3px 3px 10px ${c2}, 0 0 5px #ffffff`);
                        }
                    } else {
                        td.style.setProperty('--correct-border', wordInfo.color);
                        td.style.setProperty('--correct-text', wordInfo.color);
                    }
                    
                    const allCompleted = intersectingWords.every(w => wordsCompleted.has(w.id));
                    if(allCompleted) {
                        input.disabled = true;
                    }
                }
                
                if(currentWordInfo && wordInfo.id === currentWordInfo.id) {
                    document.getElementById('clue-meta-text').innerHTML = `<span style="color:#D4FF00; text-shadow: 0 0 10px #D4FF00;">SYSTEM OVERRIDE SUCCESS</span>`;
                    setTimeout(() => {
                       document.getElementById('clue-meta-text').innerText = `${wordInfo.direction} • ${wordInfo.length} letters`;
                    }, 1500);
                }
                
                if(wordsCompleted.size === gridData.words.length) {
                    triggerVictory();
                }
            }
        } catch(e) {
            console.error("Error auto-validating:", e);
        }
    }

    async function triggerVictory() {
        clearInterval(timerInterval);
        document.getElementById('victory-overlay').style.display = 'flex';
        document.getElementById('final-stats').innerText = `Time: ${timeSeconds}s`;
        
        try {
            await fetch(`${api_url}/score`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: current_username,
                    score: timeSeconds,
                    time_seconds: timeSeconds
                })
            });
            
            setTimeout(() => {
                window.parent.location.reload();
            }, 4000);
        } catch(e) {
             console.error("Error saving score:", e);
        }
    }

    if(current_username && api_url) {
        fetchGrid();
    } else {
        document.getElementById('grid-container').innerHTML = "<div class='loading' style='color:#ff3333;'>Missing configuration variables.</div>";
    }

</script>
